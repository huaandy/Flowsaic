[project]
name = "flowsaic-backend"
version = "0.1.0"
description = "Flowsaic backend API (FastAPI)"
readme = "README.md"
authors = [
    { name = "victordying", email = "vsantamariajr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.4",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
